name: kaggle-secrets

# Run manually once (and again whenever GEMINI_API_KEY / GOOGLE_SA_JSON / DRIVE_OAUTH_JSON change).
# Kaggle can't receive secrets through its API, so they go into a PRIVATE Kaggle dataset the dubbing run reads.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q kaggle
      - name: Upload secrets to a private Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
        run: |
          set -e
          for v in KAGGLE_USERNAME KAGGLE_KEY GEMINI_API_KEY GOOGLE_SA_JSON DRIVE_OAUTH_JSON; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is missing"; exit 1; }
          done
          mkdir -p s && cd s
          printf '%s' "$GEMINI_API_KEY" > gemini_api_key.txt
          printf '%s' "$GOOGLE_SA_JSON" > google_sa.json
          printf '%s' "$DRIVE_OAUTH_JSON" > drive_oauth.json
          printf '{"title": "maya-dub-secrets", "id": "%s/maya-dub-secrets", "licenses": [{"name": "CC0-1.0"}]}' \
            "$KAGGLE_USERNAME" > dataset-metadata.json
          if kaggle datasets status "$KAGGLE_USERNAME/maya-dub-secrets" > /dev/null 2>&1; then
            kaggle datasets version -p . -m "update secrets"
          else
            kaggle datasets create -p .          # private by default
          fi
          echo "✅ Private dataset ready: $KAGGLE_USERNAME/maya-dub-secrets"
